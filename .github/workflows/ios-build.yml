name: Build iOS IPA

on:
  workflow_dispatch: # يخليك تشغل البناء بيدك شوكت ما تريد

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔓 خطوة فك ضغط ملف المشروع مالتك
      - name: Unzip project file
        run: |
          unzip "my_app (2).zip" -d extracted_project
          # نقل الملفات للمجلد الرئيسي حتى السيرفر يشوفها مباشرة
          mv extracted_project/*/* . || mv extracted_project/* . || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 🏗️ أمر بناء الـ IPA بدون توقيع (Unsigned) حتى ينبني مباشرة على السيرفر
      - name: Build IPA
        run: flutter build ipa --no-codesign

      # 📤 رفع ملف الـ IPA الناتج حتى تكدر تحمله لحاسبتك
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ios/ipa/*.ipa
