name: Build iOS IPA

on:
  workflow_dispatch: # يخلي الزر يظهر الك حتى تشغله بيدك

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔓 فك الضغط وتشخيص اسم المجلد الداخلي
      - name: Unzip project file
        run: |
          unzip "my_app (2).zip" -d extracted_project
          # نقل كل المحتويات للمجلد الرئيسي مباشرة عشان فلاتر يشوفها
          find extracted_project -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1 > project_path.txt
          PROJECT_DIR=$(cat project_path.txt)
          mv $PROJECT_DIR/* . || true
          mv $PROJECT_DIR/.* . || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 🏗️ بناء الـ IPA بدون توقيع رقمي عشان ينجح ع السيرفر
      - name: Build IPA
        run: flutter build ipa --no-codesign

      # 📤 رفع ملف الـ IPA النهائي للتحميل
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ios/ipa/*.ipa
