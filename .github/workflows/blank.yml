name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔓 فك ضغط ملف المشروع
      - name: Unzip project file
        run: |
          unzip "my_app (2).zip" -d extracted_project
          find extracted_project -maxdepth 3 -name "pubspec.yaml" -exec dirname {} \; | head -n 1 > project_path.txt
          PROJECT_DIR=$(cat project_path.txt)
          mv $PROJECT_DIR/* . || true
          mv $PROJECT_DIR/.* . || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # 🏗️ بناء الأرشيف والتطبيق للأيفون بالمسار الصح
      - name: Build iOS Archive
        run: |
          flutter build ios --no-codesign --release
          mkdir -p build/ios/ipa
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r ../ipa/my_app.ipa Payload

      # 📤 رفع ملف الـ IPA النهائي للتحميل مباشرة
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ios/ipa/my_app.ipa
